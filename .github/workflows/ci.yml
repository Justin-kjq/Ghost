name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    name: SDK, relayer, frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test --workspace @ghost/sdk
      - run: npm test --workspace @ghost/relayer
      - run: npm run typecheck --workspace @ghost/sdk
      - run: npm run typecheck --workspace @ghost/relayer
      - name: Frontend typecheck
        working-directory: frontend
        env:
          NEXT_PUBLIC_RPC_URL: http://127.0.0.1:8899
          NEXT_PUBLIC_RELAYER_URL: http://localhost:3001
          NEXT_PUBLIC_PROGRAM_ID: 69gepJRrDXGgaKExaUHWmDjtLe4LHxTrNiGVzBGoTczR
          NEXT_PUBLIC_USDC_MINT: 11111111111111111111111111111111
        run: npx tsc --noEmit

  program:
    name: Anchor build + localnet test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Rust 1.85
        run: |
          rustup install 1.85.0
          rustup default 1.85.0
      - name: Install Solana 1.18.20
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v1.18.20/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Program keypair + wallet
        run: |
          mkdir -p target/deploy "$HOME/.config/solana"
          cp keys/ghost_pool-keypair.json target/deploy/ghost_pool-keypair.json
          solana-keygen new --no-bip39-passphrase --silent --outfile "$HOME/.config/solana/id.json"
          solana config set --url localhost
      - name: Build program (platform-tools v1.52)
        run: bash scripts/build_program.sh
      - name: Anchor test
        run: npx anchor test --skip-build
        env:
          ANCHOR_PROVIDER_URL: http://127.0.0.1:8899
          ANCHOR_WALLET: /home/runner/.config/solana/id.json
